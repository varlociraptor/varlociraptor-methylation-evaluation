# Genome information
sample:
  species: "homo_sapiens"
  datatype: "dna"
  build: "GRCh38"
  release: "110"

# Choose specific chromosome for evaluation
seq_platforms:
  Simulate: J02459

# Define reference tools for comparison against varlociraptor results
ref_tools:
  # Chose from: bismark, bisSNP, bsMap, methylDackel
  Simulate: [bsMap, bismark, bisSNP, methylDackel]

data:
  Simulate:
    simulated_data: [dummy]

samples:
  Illumina_pe: [dummy]

benchmark_repeats: 3

# Number of simulated reads
num_simulated_reads: 10000
seed: 0
###################################### METH CALLING ##################################################

# Number of scatter gather items (used for parallelization of varlociraptor methylation calling)
scatter_number: 1
# Define FDR alpha levels for varlociraptor methylation filtering
fdr_alpha: [0.01, 1.0]

###################################### PLOTS ##################################################

heatmap_bin_size: 5
# Choose from png, svg, html
plot_type: pdf
